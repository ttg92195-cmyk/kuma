name: Build Flutter APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'
          cache: true

      - name: Debug Flutter SDK path
        run: |
          echo "which flutter: $(which flutter)"
          echo "FLUTTER_ROOT: $FLUTTER_ROOT"
          echo "flutter path resolved: $(dirname $(dirname $(which flutter)))"
          ls -la $(which flutter)

      - name: Create local.properties
        run: |
          FLUTTER_SDK_PATH=$(dirname $(dirname $(which flutter)))
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          echo "flutter.sdk=$FLUTTER_SDK_PATH" >> android/local.properties
          echo "--- local.properties ---"
          cat android/local.properties
          echo "--- Verify Flutter SDK dir ---"
          ls "$FLUTTER_SDK_PATH/packages/flutter_tools/gradle" || echo "ERROR: Flutter tools gradle dir NOT FOUND"

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze code
        run: flutter analyze --no-fatal-infos || true

      - name: Build APK
        run: flutter build apk --release --no-shrink

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: kuma-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Build info
        run: |
          echo "================================"
          echo "KUMA - Build Complete!"
          echo "================================"
          echo "APK Size: $(du -h build/app/outputs/flutter-apk/app-release.apk | cut -f1)"
          echo "Build Date: $(date)"
          echo "================================"
